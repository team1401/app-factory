version: '3.8'

services:
  backend:
    build: ./backend
    container_name: debate-arena-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=info
      - CORS_ORIGIN=*
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    networks:
      - debate-arena
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: debate-arena-frontend
    restart: unless-stopped
    ports:
      - "3104:80"
    environment:
      - VITE_API_URL=http://localhost:3104
      - VITE_WS_URL=ws://localhost:3104
    depends_on:
      - backend
    networks:
      - debate-arena

networks:
  debate-arena:
    driver: bridge
