version: '3.8'

services:
  backend:
    build: .
    container_name: paperplain-backend
    ports:
      - "3108:3108"
    environment:
      - NODE_ENV=production
      - PORT=3108
      - LOG_LEVEL=info
      # Optional: Set default API keys (users can override via headers)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Required for callers to use the default keys above (Authorization: Bearer <token>)
      - PAPERPLAIN_ACCESS_TOKEN=${PAPERPLAIN_ACCESS_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3108/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); });"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
