<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GigBook — Your Gig Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Special+Elite&family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #0A0804;
      --surface:   #141008;
      --card:      #1A1408;
      --gold:      #E8B840;
      --orange:    #E85820;
      --blue:      #3060D0;
      --purple:    #8040C8;
      --green:     #30A060;
      --red:       #C82020;
      --cream:     #F4E8C0;
      --muted:     #7A6840;
      --border:    #3A2C10;
      --text:      #F0E0B0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IM Fell English', Georgia, serif;
      min-height: 100vh;
    }

    /* ─────────────────────────────────────────── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 3px solid var(--gold);
      padding: 0;
      position: relative;
      overflow: hidden;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 24px 22px;
      display: flex;
      align-items: center;
      gap: 32px;
      position: relative;
    }

    /* concert poster ornamental ring behind logo */
    .header-emblem {
      flex-shrink: 0;
      width: 72px;
      height: 72px;
    }

    .logo-block h1 {
      font-family: 'Anton', sans-serif;
      font-size: 2.8rem;
      line-height: 1;
      letter-spacing: 0.12em;
      color: var(--gold);
      text-transform: uppercase;
    }

    .logo-block .tagline {
      font-family: 'Special Elite', monospace;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .header-stats {
      margin-left: auto;
      display: flex;
      gap: 32px;
      text-align: right;
    }

    .stat-cell {
      display: flex;
      flex-direction: column;
    }

    .stat-num {
      font-family: 'Anton', sans-serif;
      font-size: 2rem;
      line-height: 1;
      color: var(--gold);
    }

    .stat-num.green  { color: var(--green); }
    .stat-num.orange { color: var(--orange); }
    .stat-num.red    { color: var(--red); }

    .stat-label {
      font-family: 'Special Elite', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ornamental divider lines */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--gold);
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      margin: 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), var(--gold), var(--border), transparent);
    }

    /* ─────────────────────────────────────────── NAV ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      gap: 0;
    }

    .nav-tab {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      padding: 12px 20px;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      user-select: none;
    }

    .nav-tab:hover { color: var(--cream); }
    .nav-tab.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }

    /* ─────────────────────────────────────────── MAIN ── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 24px;
    }

    .view { display: none; }
    .view.active { display: block; }

    /* ─────────────────────────────────────────── ADD GIG FORM ── */
    .form-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 4px solid var(--gold);
      padding: 24px;
      margin-bottom: 28px;
    }

    .form-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 0.15em;
      color: var(--gold);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .form-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.wide {
      grid-column: 1 / -1;
    }

    .form-group.two-col {
      grid-column: span 2;
    }

    label {
      font-family: 'Special Elite', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    input, select, textarea {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.9rem;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--gold);
    }

    select option { background: var(--surface); }

    textarea { resize: vertical; min-height: 70px; }

    .pay-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      padding: 12px 28px;
      cursor: pointer;
      border: none;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--gold);
      color: var(--bg);
    }
    .btn-primary:hover { background: #F0C850; }

    .btn-danger {
      background: transparent;
      color: var(--red);
      border: 1px solid var(--red);
      font-size: 0.8rem;
      padding: 6px 14px;
    }
    .btn-danger:hover { background: var(--red); color: var(--cream); }

    .btn-small {
      font-size: 0.75rem;
      padding: 6px 14px;
    }

    .btn-mark-paid {
      background: transparent;
      color: var(--green);
      border: 1px solid var(--green);
    }
    .btn-mark-paid:hover { background: var(--green); color: var(--bg); }

    /* ─────────────────────────────────────────── TOOLBAR ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .toolbar-left {
      display: flex;
      gap: 10px;
      flex: 1;
      flex-wrap: wrap;
    }

    .filter-btn {
      font-family: 'Special Elite', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 7px 14px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover { border-color: var(--gold); color: var(--gold); }
    .filter-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(232,184,64,0.08); }

    .search-box {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      padding: 8px 14px;
      outline: none;
      min-width: 200px;
    }
    .search-box:focus { border-color: var(--gold); }

    .sort-select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Special Elite', monospace;
      font-size: 0.75rem;
      padding: 8px 12px;
      letter-spacing: 0.1em;
    }

    /* ─────────────────────────────────────────── GIG LIST ── */
    .gig-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    /* ── GIG CARD — mini concert poster ── */
    .gig-card {
      background: var(--card);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      transition: transform 0.15s, border-color 0.15s;
      animation: cardIn 0.25s ease-out;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .gig-card:hover { border-color: var(--gold); transform: translateY(-2px); }

    /* color bar at top — unique per status */
    .gig-card::before {
      content: '';
      display: block;
      height: 4px;
      width: 100%;
    }

    .gig-card.paid::before    { background: var(--green); }
    .gig-card.owed::before    { background: var(--orange); }
    .gig-card.free::before    { background: var(--blue); }
    .gig-card.canceled::before { background: var(--red); }

    .card-poster-band {
      padding: 14px 16px 10px;
      background: rgba(0,0,0,0.3);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .gig-venue {
      font-family: 'Anton', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.06em;
      color: var(--cream);
      text-transform: uppercase;
      line-height: 1.1;
      word-break: break-word;
    }

    .status-badge {
      font-family: 'Special Elite', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 3px 8px;
      border: 1px solid;
      flex-shrink: 0;
    }

    .status-badge.paid    { color: var(--green);  border-color: var(--green); }
    .status-badge.owed    { color: var(--orange); border-color: var(--orange); }
    .status-badge.free    { color: var(--blue);   border-color: var(--blue); }
    .status-badge.canceled { color: var(--red);    border-color: var(--red); }

    .card-body {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .gig-date-city {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .gig-date {
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      color: var(--gold);
    }

    .gig-city {
      font-family: 'Special Elite', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    .gig-meta-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .gig-meta-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .meta-label {
      font-family: 'Special Elite', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .meta-value {
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: var(--text);
    }

    .meta-value.pay { font-size: 1.1rem; color: var(--gold); font-weight: 500; }
    .meta-value.pay.owed { color: var(--orange); }
    .meta-value.pay.paid { color: var(--green); }

    .gig-notes {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: 0.82rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 8px;
      line-height: 1.4;
    }

    /* setlist pills */
    .setlist-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .setlist-pill {
      font-family: 'Special Elite', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      padding: 2px 8px;
      background: rgba(232,184,64,0.1);
      border: 1px solid rgba(232,184,64,0.25);
      color: var(--cream);
    }

    .card-actions {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    /* ─────────────────────────────────────────── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 80px 24px;
      grid-column: 1 / -1;
    }

    .empty-emblem {
      font-size: 4rem;
      margin-bottom: 16px;
      opacity: 0.3;
    }

    .empty-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.2em;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .empty-sub {
      font-family: 'Special Elite', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      color: var(--muted);
    }

    /* ─────────────────────────────────────────── LEDGER VIEW ── */
    .ledger-header {
      display: grid;
      grid-template-columns: 90px 1fr 1fr 90px 90px 100px 80px;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-bottom: 2px solid var(--gold);
      margin-bottom: 4px;
    }

    .ledger-col-hd {
      font-family: 'Special Elite', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .ledger-row {
      display: grid;
      grid-template-columns: 90px 1fr 1fr 90px 90px 100px 80px;
      gap: 8px;
      padding: 11px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-top: none;
      align-items: center;
      transition: background 0.1s;
    }

    .ledger-row:hover { background: rgba(232,184,64,0.04); }

    .ledger-cell {
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ledger-cell.venue { font-family: 'IM Fell English', serif; font-size: 0.9rem; }
    .ledger-cell.pay   { color: var(--gold); font-weight: 500; }
    .ledger-cell.pay.owed { color: var(--orange); }
    .ledger-cell.pay.paid { color: var(--green); }
    .ledger-cell.pay.free { color: var(--blue); }
    .ledger-cell.pay.canceled { color: var(--red); }

    /* ─────────────────────────────────────────── SUMMARY VIEW ── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 3px solid;
      padding: 20px;
    }

    .summary-card.gold  { border-top-color: var(--gold); }
    .summary-card.green { border-top-color: var(--green); }
    .summary-card.orange { border-top-color: var(--orange); }
    .summary-card.blue  { border-top-color: var(--blue); }
    .summary-card.purple { border-top-color: var(--purple); }

    .summary-num {
      font-family: 'Anton', sans-serif;
      font-size: 2.8rem;
      line-height: 1;
      color: var(--gold);
      margin-bottom: 4px;
    }

    .summary-card.green  .summary-num { color: var(--green); }
    .summary-card.orange .summary-num { color: var(--orange); }
    .summary-card.blue   .summary-num { color: var(--blue); }
    .summary-card.purple .summary-num { color: var(--purple); }

    .summary-label {
      font-family: 'Special Elite', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .summary-sub {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 6px;
    }

    /* monthly chart */
    .chart-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 3px solid var(--gold);
      padding: 24px;
      margin-bottom: 24px;
    }

    .chart-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 0.15em;
      color: var(--gold);
      margin-bottom: 20px;
    }

    .chart-bars {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 140px;
    }

    .chart-bar-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      height: 100%;
      justify-content: flex-end;
    }

    .chart-bar {
      width: 100%;
      background: var(--gold);
      transition: height 0.5s ease-out;
      min-height: 2px;
      position: relative;
    }

    .chart-bar-label {
      font-family: 'Special Elite', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-align: center;
    }

    .chart-bar-val {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--gold);
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    /* top venues table */
    .venues-table {
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 3px solid var(--purple);
      padding: 24px;
    }

    .table-row {
      display: grid;
      grid-template-columns: 30px 1fr 60px 80px 90px;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }

    .table-row:last-child { border-bottom: none; }

    .table-rank {
      font-family: 'Anton', sans-serif;
      font-size: 1.2rem;
      color: var(--gold);
      text-align: center;
    }

    .table-venue {
      font-family: 'IM Fell English', serif;
      font-size: 0.95rem;
      color: var(--cream);
    }

    .table-val {
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: right;
    }

    .table-val.pay { color: var(--gold); }
    .table-val.pay.green { color: var(--green); }

    /* ─────────────────────────────────────────── FLOATING ADD BTN ── */
    .fab {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--gold);
      color: var(--bg);
      font-family: 'Anton', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      padding: 14px 20px;
      cursor: pointer;
      border: none;
      box-shadow: 0 4px 20px rgba(232,184,64,0.3);
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      z-index: 100;
    }

    .fab:hover {
      background: #F0C850;
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(232,184,64,0.4);
    }

    /* ─────────────────────────────────────────── MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 4px solid var(--gold);
      padding: 28px;
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 0.15em;
      color: var(--gold);
      margin-bottom: 24px;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.9rem;
      padding: 4px 10px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .modal-close:hover { border-color: var(--red); color: var(--red); }

    .setlist-input-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .setlist-tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .setlist-tag {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: 'Special Elite', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      background: rgba(232,184,64,0.1);
      border: 1px solid rgba(232,184,64,0.3);
      color: var(--cream);
    }

    .setlist-tag button {
      background: none;
      border: none;
      color: var(--red);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0;
      line-height: 1;
    }

    /* ─────────────────────────────────────────── RESPONSIVE ── */
    @media (max-width: 700px) {
      .header-inner  { flex-wrap: wrap; }
      .header-stats  { width: 100%; justify-content: space-between; margin-left: 0; }
      .gig-grid      { grid-template-columns: 1fr; }
      .ledger-header,
      .ledger-row    { grid-template-columns: 80px 1fr 80px 70px; }
      .ledger-col-hd:nth-child(3),
      .ledger-col-hd:nth-child(5),
      .ledger-cell:nth-child(3),
      .ledger-cell:nth-child(5) { display: none; }
      .fab           { bottom: 16px; right: 16px; }
      .summary-grid  { grid-template-columns: 1fr 1fr; }
    }

    /* ─────────────────────────────────────────── TOAST ── */
    .toast {
      position: fixed;
      bottom: 80px;
      right: 28px;
      background: var(--card);
      border: 1px solid var(--gold);
      border-left: 4px solid var(--gold);
      color: var(--text);
      font-family: 'Special Elite', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      padding: 12px 18px;
      z-index: 300;
      opacity: 0;
      transform: translateX(20px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      max-width: 280px;
    }

    .toast.show { opacity: 1; transform: translateX(0); }
  </style>
</head>

<header>

    <svg class="header-emblem" viewBox="0 0 72 72" fill="none">
      <circle cx="36" cy="36" r="34" stroke="#E8B840" stroke-width="1.5" />
      <circle cx="36" cy="36" r="28" stroke="#E8B840" stroke-width="0.5" />
      <path d="M36 10 L40 26 L36 22 L32 26 Z" fill="#E85820" />
      <path d="M36 62 L40 46 L36 50 L32 46 Z" fill="#E85820" />
      <path d="M10 36 L26 40 L22 36 L26 32 Z" fill="#E85820" />
      <path d="M62 36 L46 40 L50 36 L46 32 Z" fill="#E85820" />

<!-- ════════════════════════════════════════════ MAIN -->
<main>

  <!-- ──────────── GIGS VIEW ──────────── -->
  <div class="view active" id="view-gigs">

      <span class="ledger-col-hd">Type</span>

<button class="fab" id="fab-add" onclick="openModal()">+ LOG GIG</button>

<!-- ════════════════════════════════════════════ MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕ CLOSE</button>
    <div class="modal-title" id="modal-title">Log a Gig</div>

    <form id="gig-form" autocomplete="off">
      <div class="form-grid">

        <div class="form-group">
          <label for="f-date">Date *</label>
          <input type="date" id="f-date" required />
        </div>

        <div class="form-group two-col">
          <label for="f-venue">Venue / Event Name *</label>
          <input type="text" id="f-venue" placeholder="The Blue Moon" required />
        </div>

        <div class="form-group">
          <label for="f-city">City</label>
          <input type="text" id="f-city" placeholder="Nashville, TN" />
        </div>

        <div class="form-group">
          <label for="f-type">Gig Type</label>
          <select id="f-type">
            <option value="Live Performance">Live Performance</option>
            <option value="Recording Session">Recording Session</option>
            <option value="Rehearsal (paid)">Rehearsal (paid)</option>
            <option value="Private Event">Private Event</option>
            <option value="Corporate">Corporate</option>
            <option value="Wedding">Wedding</option>
            <option value="Residency">Residency</option>
            <option value="Festival">Festival</option>
            <option value="Open Mic">Open Mic</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="f-hours">Hours Played</label>
          <input type="number" id="f-hours" min="0" step="0.5" placeholder="3" />
        </div>

        <div class="form-group">
          <label for="f-contact">Booker / Contact</label>
          <input type="text" id="f-contact" placeholder="Mike Johnson" />
        </div>

        <div class="form-group wide">
          <label>Pay Details</label>
          <div class="pay-row">
            <div>
              <label for="f-pay" style="margin-bottom:5px;display:block">Amount ($)</label>
              <input type="number" id="f-pay" min="0" step="5" placeholder="200" />
            </div>
            <div>
              <label for="f-pay-status" style="margin-bottom:5px;display:block">Pay Status</label>
              <select id="f-pay-status">
                <option value="owed">Owed / Unpaid</option>
                <option value="paid">Paid / Collected</option>
                <option value="free">Free / Traded</option>
                <option value="canceled">Canceled</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-group wide">
          <label>Setlist / Songs Played</label>
          <div class="setlist-input-row">
            <input type="text" id="f-song-input" placeholder="Song title…" style="flex:1" />
            <button type="button" class="btn btn-primary btn-small" onclick="addSong()">Add</button>
          </div>
          <div class="setlist-tag-list" id="setlist-tags"></div>
        </div>

        <div class="form-group wide">
          <label for="f-notes">Notes</label>
          <textarea id="f-notes" placeholder="Sound system issues, encore, tips, who was there…"></textarea>
        </div>

      </div>

      <div style="margin-top:20px;display:flex;gap:12px;justify-content:flex-end">
        <button type="button" class="btn btn-danger" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Gig</button>
      </div>
    </form>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
  // ─────────────────────────────────────────── STATE
  const STORAGE_KEY = 'gigbook_gigs_v1';
  let gigs = [];
  let editingId = null;
  let currentFilter = 'all';
  let currentSetlist = [];

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      gigs = raw ? JSON.parse(raw) : [];
    } catch(e) { gigs = []; }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(gigs));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  // ─────────────────────────────────────────── INIT
  load();
  seedDemoData();
  renderAll();

  function seedDemoData() {
    if (gigs.length > 0) return;
    const demos = [
      { id: uid(), date: '2026-03-15', venue: "The Rusty Nail", city: "Phoenix, AZ", type: "Live Performance", hours: 3, contact: "Dave Hooper", pay: 250, payStatus: "paid", setlist: ["Jolene", "Tennessee Whiskey", "Wagon Wheel", "Friends in Low Places"], notes: "Great crowd. Encore requested. Tips jar was generous." },
      { id: uid(), date: '2026-03-08', venue: "Blue Water Lounge", city: "Scottsdale, AZ", type: "Private Event", hours: 4, contact: "Karen Mills", pay: 500, payStatus: "owed", setlist: ["Sweet Home Chicago", "The Weight", "Helplessly Hoping"], notes: "Corporate birthday party. Karen still hasn't sent the check." },
      { id: uid(), date: '2026-02-22', venue: "Skyline Rooftop Bar", city: "Tempe, AZ", type: "Residency", hours: 2.5, contact: "Tommy Russo", pay: 175, payStatus: "paid", setlist: ["Brown Eyed Girl", "Take It Easy", "Hotel California"], notes: "Every other Friday. Going well." },
      { id: uid(), date: '2026-02-14', venue: "Valentine's Benefit Gala", city: "Sedona, AZ", type: "Festival", hours: 1.5, contact: "City Arts Council", pay: 0, payStatus: "free", setlist: ["At Last", "Can't Help Falling In Love"], notes: "Performed for charity. Good exposure, good people." },
      { id: uid(), date: '2026-01-31', venue: "The Fox Den", city: "Flagstaff, AZ", type: "Live Performance", hours: 3, contact: "Stacy B", pay: 200, payStatus: "paid", setlist: ["Whiskey in the Jar", "The House of the Rising Sun", "Redemption Song"], notes: "" },
      { id: uid(), date: '2026-01-18', venue: "Meridian Hotel Lobby", city: "Phoenix, AZ", type: "Corporate", hours: 2, contact: "Events Dept", pay: 400, payStatus: "owed", setlist: [], notes: "Contract was for $400. They said check is 'in the mail' — still waiting." },
      { id: uid(), date: '2025-12-31', venue: "NYE Block Party", city: "Scottsdale, AZ", type: "Festival", hours: 5, contact: "Kyle Marsh", pay: 750, payStatus: "paid", setlist: ["Auld Lang Syne", "Wonderwall", "Don't Stop Me Now", "Mr. Brightside", "Sweet Caroline"], notes: "Best gig of the year. Crowd was electric." },
    ];
    gigs = demos;
    save();
  }

  // ─────────────────────────────────────────── MODAL
  function openModal(id) {
    editingId = id || null;
    currentSetlist = [];
    document.getElementById('setlist-tags').innerHTML = '';

    if (id) {
      const g = gigs.find(x => x.id === id);
      if (!g) return;
      document.getElementById('modal-title').textContent = 'Edit Gig';
      document.getElementById('f-date').value = g.date;
      document.getElementById('f-venue').value = g.venue;
      document.getElementById('f-city').value = g.city;
      document.getElementById('f-type').value = g.type;
      document.getElementById('f-hours').value = g.hours || '';
      document.getElementById('f-contact').value = g.contact || '';
      document.getElementById('f-pay').value = g.pay || '';
      document.getElementById('f-pay-status').value = g.payStatus;
      document.getElementById('f-notes').value = g.notes || '';
      currentSetlist = [...(g.setlist || [])];
      renderSetlistTags();
    } else {
      document.getElementById('modal-title').textContent = 'Log a Gig';
      document.getElementById('gig-form').reset();
      document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
    }

    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    editingId = null;
    currentSetlist = [];
  }

  document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // ─────────────────────────────────────────── SETLIST
  function addSong() {
    const inp = document.getElementById('f-song-input');
    const val = inp.value.trim();
    if (!val) return;
    currentSetlist.push(val);
    inp.value = '';
    renderSetlistTags();
    inp.focus();
  }

  document.getElementById('f-song-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); addSong(); }
  });

  function removeSong(i) {
    currentSetlist.splice(i, 1);
    renderSetlistTags();
  }

  function renderSetlistTags() {
    const container = document.getElementById('setlist-tags');
    container.innerHTML = currentSetlist.map((s, i) => `
      <span class="setlist-tag">
        ${escHtml(s)}
        <button type="button" onclick="removeSong(${i})" title="Remove">✕</button>
      </span>
    `).join('');
  }

  // ─────────────────────────────────────────── FORM SUBMIT
  document.getElementById('gig-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const g = {
      id: editingId || uid(),
      date: document.getElementById('f-date').value,
      venue: document.getElementById('f-venue').value.trim(),
      city: document.getElementById('f-city').value.trim(),
      type: document.getElementById('f-type').value,
      hours: parseFloat(document.getElementById('f-hours').value) || 0,
      contact: document.getElementById('f-contact').value.trim(),
      pay: parseFloat(document.getElementById('f-pay').value) || 0,
      payStatus: document.getElementById('f-pay-status').value,
      setlist: [...currentSetlist],
      notes: document.getElementById('f-notes').value.trim(),
    };

    if (editingId) {
      const idx = gigs.findIndex(x => x.id === editingId);
      if (idx >= 0) gigs[idx] = g;
    } else {
      gigs.unshift(g);
    }

    save();
    renderAll();
    closeModal();
    toast(editingId ? 'Gig updated!' : 'Gig logged!');
  });

  // ─────────────────────────────────────────── DELETE & MARK PAID
  function deleteGig(id) {
    if (!confirm('Remove this gig from your ledger?')) return;
    gigs = gigs.filter(g => g.id !== id);
    save();
    renderAll();
    toast('Gig removed.');
  }

  function markPaid(id) {
    const g = gigs.find(x => x.id === id);
    if (!g) return;
    g.payStatus = 'paid';
    save();
    renderAll();
    toast('Marked as paid! 💰');
  }

  // ─────────────────────────────────────────── FILTER / SORT / SEARCH
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      currentFilter = this.dataset.filter;
      renderGigs();
    });
  });

  document.getElementById('search-box').addEventListener('input', renderGigs);
  document.getElementById('sort-select').addEventListener('change', renderGigs);

  function getFiltered() {
    let arr = [...gigs];
    const q = document.getElementById('search-box').value.toLowerCase();
    if (q) arr = arr.filter(g =>
      g.venue.toLowerCase().includes(q) ||
      g.city.toLowerCase().includes(q) ||
      (g.notes || '').toLowerCase().includes(q) ||
      (g.contact || '').toLowerCase().includes(q)
    );
    if (currentFilter !== 'all') arr = arr.filter(g => g.payStatus === currentFilter);
    const sort = document.getElementById('sort-select').value;
    if (sort === 'date-asc')  arr.sort((a,b) => a.date.localeCompare(b.date));
    if (sort === 'date-desc') arr.sort((a,b) => b.date.localeCompare(a.date));
    if (sort === 'pay-desc')  arr.sort((a,b) => b.pay - a.pay);
    if (sort === 'venue-az')  arr.sort((a,b) => a.venue.localeCompare(b.venue));
    return arr;
  }

  // ─────────────────────────────────────────── RENDER
  function renderAll() {
    renderStats();
    renderGigs();
    renderLedger();
    renderSummary();
  }

  function renderStats() {
    const now = new Date();
    const ytdStart = now.getFullYear() + '-01-01';
    let totalGigs = gigs.length;
    let collected = 0, owed = 0, ytd = 0;
    gigs.forEach(g => {
      if (g.payStatus === 'paid')  collected += g.pay;
      if (g.payStatus === 'owed')  owed += g.pay;
      if (g.date >= ytdStart && (g.payStatus === 'paid' || g.payStatus === 'owed')) ytd += g.pay;
    });
    document.getElementById('stat-total-gigs').textContent = totalGigs;
    document.getElementById('stat-paid').textContent  = '$' + fmt(collected);
    document.getElementById('stat-owed').textContent  = '$' + fmt(owed);
    document.getElementById('stat-ytd').textContent   = '$' + fmt(ytd);
  }

  function renderGigs() {
    const arr = getFiltered();
    const container = document.getElementById('gig-grid');
    if (!arr.length) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-emblem">🎸</div>
          <div class="empty-title">No Gigs Found</div>
          <div class="empty-sub">Log your first gig using the button below</div>
        </div>`;
      return;
    }
    container.innerHTML = arr.map(g => cardHtml(g)).join('');
  }

  function cardHtml(g) {
    const hasPay = g.payStatus !== 'free' && g.payStatus !== 'canceled' && g.pay > 0;
    const payClass = g.payStatus;
    const payDisplay = g.payStatus === 'free' ? 'Free / Traded'
                     : g.payStatus === 'canceled' ? 'Canceled'
                     : '$' + fmt(g.pay);

    return `
    <div class="gig-card ${g.payStatus}" data-id="${g.id}">
      <div class="card-poster-band">
        <div class="gig-venue">${escHtml(g.venue)}</div>
        <span class="status-badge ${g.payStatus}">${g.payStatus === 'owed' ? 'UNPAID' : g.payStatus.toUpperCase()}</span>
      </div>
      <div class="card-body">
        <div class="gig-date-city">
          <span class="gig-date">${fmtDate(g.date)}</span>
          ${g.city ? `<span class="gig-city">${escHtml(g.city)}</span>` : ''}
        </div>
        <div class="gig-meta-row">
          ${hasPay || g.payStatus !== 'free' ? `
          <div class="gig-meta-item">
            <span class="meta-label">Pay</span>
            <span class="meta-value pay ${payClass}">${payDisplay}</span>
          </div>` : ''}
          <div class="gig-meta-item">
            <span class="meta-label">Type</span>
            <span class="meta-value">${escHtml(g.type)}</span>
          </div>
          ${g.hours ? `
          <div class="gig-meta-item">
            <span class="meta-label">Hours</span>
            <span class="meta-value">${g.hours}h</span>
          </div>` : ''}
          ${g.contact ? `
          <div class="gig-meta-item">
            <span class="meta-label">Contact</span>
            <span class="meta-value">${escHtml(g.contact)}</span>
          </div>` : ''}
        </div>
        ${g.setlist && g.setlist.length ? `
        <div>
          <span class="meta-label" style="display:block;margin-bottom:4px">Setlist (${g.setlist.length})</span>
          <div class="setlist-pills">
            ${g.setlist.map(s => `<span class="setlist-pill">${escHtml(s)}</span>`).join('')}
          </div>
        </div>` : ''}
        ${g.notes ? `<div class="gig-notes">"${escHtml(g.notes)}"</div>` : ''}
      </div>
      <div class="card-actions">
        ${g.payStatus === 'owed' ? `<button class="btn btn-mark-paid btn-small" onclick="markPaid('${g.id}')">Mark Paid</button>` : ''}
        <button class="btn btn-primary btn-small" onclick="openModal('${g.id}')">Edit</button>
        <button class="btn btn-danger btn-small" onclick="deleteGig('${g.id}')">Delete</button>
      </div>
    </div>`;
  }

  function renderLedger() {
    const arr = [...gigs].sort((a,b) => b.date.localeCompare(a.date));
    const container = document.getElementById('ledger-rows');
    if (!arr.length) {
      container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted);font-family:Special Elite,monospace;letter-spacing:0.15em;font-size:0.8rem">NO GIGS IN LEDGER YET</div>';
      return;
    }
    container.innerHTML = arr.map(g => {
      const pay = g.payStatus === 'free' ? '—'
                : g.payStatus === 'canceled' ? '—'
                : '$' + fmt(g.pay);
      return `
      <div class="ledger-row">
        <span class="ledger-cell">${g.date}</span>
        <span class="ledger-cell venue">${escHtml(g.venue)}</span>
        <span class="ledger-cell">${escHtml(g.city || '—')}</span>
        <span class="ledger-cell">${escHtml(g.type)}</span>
        <span class="ledger-cell">${g.hours ? g.hours + 'h' : '—'}</span>
        <span class="ledger-cell pay ${g.payStatus}">${pay}</span>
        <span class="ledger-cell"><span class="status-badge ${g.payStatus}" style="font-size:0.6rem">${g.payStatus.toUpperCase()}</span></span>
      </div>`;
    }).join('');
  }

  function renderSummary() {
    // stats
    const now = new Date();
    const thisYear = now.getFullYear().toString();
    const ytdGigs = gigs.filter(g => g.date.startsWith(thisYear));
    const totalPaid = gigs.filter(g => g.payStatus === 'paid').reduce((s,g) => s + g.pay, 0);
    const totalOwed = gigs.filter(g => g.payStatus === 'owed').reduce((s,g) => s + g.pay, 0);
    const totalHours = gigs.reduce((s,g) => s + (g.hours || 0), 0);
    const avgPay = gigs.filter(g => g.pay > 0 && g.payStatus !== 'canceled').length
      ? (gigs.filter(g => g.pay > 0 && g.payStatus !== 'canceled').reduce((s,g) => s + g.pay, 0) /
         gigs.filter(g => g.pay > 0 && g.payStatus !== 'canceled').length)
      : 0;

    document.getElementById('summary-grid').innerHTML = `
      <div class="summary-card gold">
        <div class="summary-num">${gigs.length}</div>
        <div class="summary-label">Total Gigs Logged</div>
        <div class="summary-sub">${ytdGigs.length} this year</div>
      </div>
      <div class="summary-card green">
        <div class="summary-num">$${fmt(totalPaid)}</div>
        <div class="summary-label">Total Collected</div>
        <div class="summary-sub">Paid in full</div>
      </div>
      <div class="summary-card orange">
        <div class="summary-num">$${fmt(totalOwed)}</div>
        <div class="summary-label">Outstanding Balance</div>
        <div class="summary-sub">${gigs.filter(g => g.payStatus === 'owed').length} unpaid gig(s)</div>
      </div>
      <div class="summary-card blue">
        <div class="summary-num">${totalHours.toFixed(1)}h</div>
        <div class="summary-label">Hours Performed</div>
        <div class="summary-sub">Logged stage time</div>
      </div>
      <div class="summary-card purple">
        <div class="summary-num">$${fmt(Math.round(avgPay))}</div>
        <div class="summary-label">Average Gig Pay</div>
        <div class="summary-sub">Excl. free & canceled</div>
      </div>
    `;

    // monthly chart (last 12 months)
    const months = [];
    for (let i = 11; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      months.push({
        key: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,
        label: d.toLocaleString('default',{month:'short'}).toUpperCase(),
        total: 0,
        count: 0,
      });
    }
    gigs.forEach(g => {
      const mo = g.date.slice(0,7);
      const m = months.find(x => x.key === mo);
      if (m && (g.payStatus === 'paid' || g.payStatus === 'owed')) {
        m.total += g.pay;
        m.count++;
      }
    });
    const maxTotal = Math.max(...months.map(m => m.total), 1);

    document.getElementById('monthly-chart').innerHTML = months.map(m => {
      const pct = Math.round((m.total / maxTotal) * 100);
      return `
      <div class="chart-bar-wrap">
        <div class="chart-bar" style="height:${pct}%;position:relative">
          ${m.total > 0 ? `<span class="chart-bar-val">$${fmtShort(m.total)}</span>` : ''}
        </div>
        <div class="chart-bar-label">${m.label}</div>
      </div>`;
    }).join('');

    // top venues
    const venueMap = {};
    gigs.forEach(g => {
      if (!venueMap[g.venue]) venueMap[g.venue] = { total: 0, count: 0, paid: 0 };
      venueMap[g.venue].total += g.pay;
      venueMap[g.venue].count++;
      if (g.payStatus === 'paid') venueMap[g.venue].paid += g.pay;
    });
    const sorted = Object.entries(venueMap).sort((a,b) => b[1].count - a[1].count).slice(0,8);

    if (!sorted.length) {
      document.getElementById('top-venues').innerHTML = '<div style="color:var(--muted);font-family:Special Elite,monospace;font-size:0.8rem;padding:20px 0">No venue data yet</div>';
      return;
    }

    const hdr = `
      <div class="table-row" style="opacity:0.5;font-size:0.7rem">
        <span style="font-family:Special Elite,monospace;letter-spacing:0.15em;color:var(--muted)">#</span>
        <span style="font-family:Special Elite,monospace;letter-spacing:0.15em;color:var(--muted)">VENUE</span>
        <span style="font-family:Special Elite,monospace;letter-spacing:0.15em;color:var(--muted);text-align:right">GIGS</span>
        <span style="font-family:Special Elite,monospace;letter-spacing:0.15em;color:var(--muted);text-align:right">COLLECTED</span>
        <span style="font-family:Special Elite,monospace;letter-spacing:0.15em;color:var(--muted);text-align:right">TOTAL BILLED</span>
      </div>`;

    document.getElementById('top-venues').innerHTML = hdr + sorted.map(([venue, d], i) => `
      <div class="table-row">
        <span class="table-rank">${i+1}</span>
        <span class="table-venue">${escHtml(venue)}</span>
        <span class="table-val" style="text-align:right">${d.count}</span>
        <span class="table-val pay green" style="text-align:right">$${fmt(d.paid)}</span>
        <span class="table-val pay" style="text-align:right">$${fmt(d.total)}</span>
      </div>`).join('');
  }

  // ─────────────────────────────────────────── TABS
  document.querySelectorAll('.nav-tab').forEach(tab => {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      this.classList.add('active');
      document.getElementById('view-' + this.dataset.view).classList.add('active');
    });
  });

  // ─────────────────────────────────────────── UTILS
  function fmt(n) {
    if (!n && n !== 0) return '0';
    return n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  }

  function fmtShort(n) {
    if (n >= 1000) return (n/1000).toFixed(1).replace('.0','') + 'k';
    return n;
  }

  function fmtDate(s) {
    if (!s) return '';
    const [y,m,d] = s.split('-');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[parseInt(m)-1]} ${parseInt(d)}, ${y}`;
  }

  function escHtml(s) {
    if (!s) return '';
    return String(s)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function toast(msg, duration=2800) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), duration);
  }
</script>
</body>
</html>
