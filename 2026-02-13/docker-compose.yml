version: '3.8'

services:
  backend:
    build: ./backend
    container_name: agent-rep-check-backend
    ports:
      - "3106:3106"
    environment:
      - PORT=3106
      - NODE_ENV=production
      - SERVER_KEYS_ACCESS_TOKEN=${SERVER_KEYS_ACCESS_TOKEN:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3106/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build: ./frontend
    container_name: agent-rep-check-frontend
    ports:
      - "3105:80"
    environment:
      - VITE_API_URL=http://100.97.65.28:3106
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
