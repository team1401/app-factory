<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mise — Your kitchen, dialed in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Setup Mode -->
    <div id="setup-view" class="view active">
      <header class="app-header">
        <div class="header-inner">
          <div class="logo">
            <span class="logo-mark">m</span>
            <span class="logo-text">mise</span>
          </div>
          <p class="logo-subtitle">Everything in its place</p>
        </div>
        <div class="serve-time-block">
          <label for="serve-time">Dinner on the table at</label>
          <div class="time-input-wrapper">
            <input type="time" id="serve-time" value="19:00">
          </div>
        </div>
      </header>

      <main class="setup-main">
        <div class="dishes-section">
          <div class="section-header">
            <h2>What are you cooking?</h2>
            <button class="btn-add" id="add-dish-btn">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <line x1="8" y1="2" x2="8" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              Add dish
            </button>
          </div>

          <div id="dishes-list" class="dishes-list">
            <!-- Dishes rendered here -->
          </div>

          <div id="empty-state" class="empty-state">
            <div class="empty-illustration">
              <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                <circle cx="32" cy="32" r="28" stroke="#C4A882" stroke-width="1.5"/>
                <path d="M20 32 C20 25 26 20 32 20 C38 20 44 25 44 32" stroke="#C4A882" stroke-width="1.5" stroke-linecap="round"/>
                <circle cx="26" cy="32" r="2" fill="#C4A882"/>
                <circle cx="38" cy="32" r="2" fill="#C4A882"/>
                <path d="M26 40 Q32 44 38 40" stroke="#C4A882" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </div>
            <p>Add your first dish to begin planning.</p>
            <p class="empty-hint">Everything gets backward-scheduled from your serve time.</p>
          </div>
        </div>

        <!-- Timeline Preview -->
        <div id="timeline-section" class="timeline-section hidden">
          <div class="section-header">
            <h2>Cook order</h2>
            <span id="earliest-start-label" class="start-label"></span>
          </div>
          <div id="timeline-container" class="timeline-container">
            <!-- Timeline rows rendered here -->
          </div>
          <div id="conflict-warnings" class="conflict-warnings hidden"></div>
        </div>
      </main>

      <footer class="setup-footer">
        <button class="btn-service" id="start-service-btn" disabled>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="9" cy="9" r="7.5" stroke="currentColor" stroke-width="1.5"/>
            <polygon points="7,6 13,9 7,12" fill="currentColor"/>
          </svg>
          Start service
        </button>
        <p class="service-hint" id="service-hint">Add at least one dish to begin service</p>
      </footer>
    </div>

    <!-- Service Mode -->
    <div id="service-view" class="view">
      <div class="service-header">
        <div class="service-logo">
          <span class="logo-mark">m</span>
          <span class="logo-text">mise</span>
        </div>
        <div class="service-clock-block">
          <div id="service-clock" class="service-clock">--:--</div>
          <div id="service-countdown" class="service-countdown">-- until dinner</div>
        </div>
        <button class="btn-exit" id="exit-service-btn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <line x1="3" y1="3" x2="13" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="13" y1="3" x2="3" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Exit
        </button>
      </div>

      <div class="service-timeline-container">
        <div id="service-timeline" class="service-timeline">
          <!-- Service timeline rows -->
        </div>
        <div class="timeline-now-track">
          <div id="timeline-playhead" class="timeline-playhead"></div>
        </div>
      </div>

      <div id="action-queue" class="action-queue">
        <div class="queue-header">
          <h3>Up next</h3>
        </div>
        <div id="action-list" class="action-list">
          <!-- Actions rendered here -->
        </div>
      </div>

      <div id="completed-log" class="completed-log hidden">
        <h3>Done</h3>
        <div id="completed-list" class="completed-list"></div>
      </div>
    </div>
  </div>

  <!-- Dish Modal -->
  <div id="dish-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Add dish</h3>
        <button class="modal-close" id="modal-close-btn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <line x1="3" y1="3" x2="13" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="13" y1="3" x2="3" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-field">
          <label for="dish-name">Dish name</label>
          <input type="text" id="dish-name" placeholder="e.g., Roasted chicken" maxlength="60">
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="dish-prep">Prep time</label>
            <div class="time-unit-input">
              <input type="number" id="dish-prep" min="0" max="240" value="0" placeholder="0">
              <span class="unit">min</span>
            </div>
          </div>
          <div class="form-field">
            <label for="dish-cook">Cook/bake time</label>
            <div class="time-unit-input">
              <input type="number" id="dish-cook" min="1" max="480" value="30" placeholder="30">
              <span class="unit">min</span>
            </div>
          </div>
          <div class="form-field">
            <label for="dish-rest">Rest/hold time</label>
            <div class="time-unit-input">
              <input type="number" id="dish-rest" min="0" max="120" value="0" placeholder="0">
              <span class="unit">min</span>
            </div>
          </div>
        </div>

        <div class="form-field">
          <label for="dish-notes">Notes <span class="optional">(optional)</span></label>
          <input type="text" id="dish-notes" placeholder="e.g., Cover with foil for last 20 min" maxlength="120">
        </div>

        <div class="form-field">
          <label>Category</label>
          <div class="category-picker" id="category-picker">
            <button class="cat-btn active" data-cat="protein">Protein</button>
            <button class="cat-btn" data-cat="veg">Veg</button>
            <button class="cat-btn" data-cat="starch">Starch</button>
            <button class="cat-btn" data-cat="sauce">Sauce</button>
            <button class="cat-btn" data-cat="bread">Bread</button>
            <button class="cat-btn" data-cat="dessert">Dessert</button>
            <button class="cat-btn" data-cat="other">Other</button>
          </div>
        </div>

        <!-- Quick-add presets -->
        <div class="form-field">
          <label>Quick presets</label>
          <div class="presets-grid" id="presets-grid">
            <!-- Rendered by JS -->
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="modal-cancel-btn">Cancel</button>
        <button class="btn-save" id="modal-save-btn">Save dish</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
